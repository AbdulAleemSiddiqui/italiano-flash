<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="#0e1020"/>
  <g transform="translate(51.2,51.2) scale(0.8)">
  <!-- dark backdrop -->
  <rect width="512" height="512" rx="96" fill="#0e1020"/>
  <!-- teal circle -->
  <circle cx="256" cy="266" r="222" fill="#0e93ad"/>
  <circle cx="250" cy="258" r="214" fill="#1cb5cf"/>

  <!-- index tabs on the right edge of the book -->
  <rect x="392" y="34"  width="62" height="52" rx="10" fill="#3fbf5a"/>
  <rect x="392" y="98"  width="70" height="56" rx="10" fill="#f5991c"/>
  <rect x="392" y="166" width="70" height="58" rx="10" fill="#f062a8"/>
  <rect x="392" y="236" width="70" height="56" rx="10" fill="#f7c948"/>
  <rect x="392" y="304" width="70" height="58" rx="10" fill="#ee4266"/>
  <rect x="392" y="374" width="62" height="54" rx="10" fill="#2fa84f"/>

  <!-- white page block peeking below the cover -->
  <rect x="118" y="424" width="326" height="42" rx="8" fill="#e9edf8"/>
  <rect x="132" y="452" width="312" height="14" rx="7" fill="#cdd5ea"/>

  <!-- book cover -->
  <rect x="86" y="14" width="330" height="440" rx="14" fill="#3947b5"/>
  <!-- spine -->
  <path d="M86 28 a14 14 0 0 1 14 -14 h22 v440 h-22 a14 14 0 0 1 -14 -14 z" fill="#2c3aa0"/>
  <!-- cover highlight edge -->
  <rect x="122" y="14" width="8" height="440" fill="#2c3aa0" opacity="0.55"/>

  <!-- Aa lettering -->
  <text x="262" y="172" font-family="Arial, Helvetica, sans-serif" font-size="150" font-weight="bold" fill="#ffffff" text-anchor="middle">Aa</text>

  <!-- text panel -->
  <rect x="146" y="212" width="220" height="196" rx="14" fill="#ffffff" opacity="0.28"/>
  <rect x="170" y="238" width="118" height="20" rx="10" fill="#ffffff"/>
  <rect x="170" y="284" width="170" height="16" rx="8" fill="#c6cfe4" opacity="0.9"/>
  <rect x="170" y="322" width="170" height="16" rx="8" fill="#c6cfe4" opacity="0.9"/>
  <rect x="170" y="360" width="96"  height="16" rx="8" fill="#c6cfe4" opacity="0.9"/>
</g>
</svg>